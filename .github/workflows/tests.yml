# À chaque envoi sur GitHub : on reconstruit les données depuis zéro et on lance les tests.
# Rien ne doit arriver sur main si ce contrôle est rouge.
name: tests
on:
  push:
  pull_request:
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m malidata run
      - run: python -m pytest -q
